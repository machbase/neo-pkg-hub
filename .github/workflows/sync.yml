name: sync packages

on:
  # packages.yaml is the source of truth for the experiment gate, so a change to
  # it must publish immediately — waiting for the nightly cron would leave a
  # package exposed (or hidden) for up to 24h. The bot commit only touches
  # packages.json and carries [skip ci], so this cannot loop.
  push:
    branches: [main]
    paths: ['packages.yaml']
  pull_request:
    paths: ['packages.yaml']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate packages.yaml BEFORE anything regenerates packages.json. Runs on pull
  # requests too: `experiment` is a required key, so a forgotten or misspelled
  # one would otherwise reach main and fail every subsequent nightly sync —
  # blocking publication for every package, not just the new one.
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # A key typo (`experment:`) surfaces as a missing key, and a YAML 1.1 habit
      # (`experiment: yes`) or a quoted value surfaces as a non-boolean. Both
      # would silently resolve to false — i.e. publish an unvalidated package to
      # every user — so both are hard failures.
      - name: Check experiment field
        run: |
          missing=$(yq -o=json -I=0 '[.packages[] | select(has("experiment") | not) | .name]' packages.yaml)
          nonbool=$(yq -o=json -I=0 '[.packages[] | select(has("experiment")) | select(.experiment | tag != "!!bool") | .name]' packages.yaml)
          fail=0
          if [[ "$missing" != "[]" ]]; then
            echo "ERROR experiment key missing (typo?): $missing"
            fail=1
          fi
          if [[ "$nonbool" != "[]" ]]; then
            echo "ERROR experiment must be a YAML boolean true/false (not yes/no, \"false\", or 1): $nonbool"
            fail=1
          fi
          exit $fail

  sync:
    needs: validate-yaml
    # Pull requests validate packages.yaml only — they must never regenerate or
    # push packages.json.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install deps (semver)
        run: npm install --no-audit --no-fund

      # exit 2 is sync.sh's "published fine, but one or more repositories could not
      # be read". Those packages kept their previous entry, so the output is still
      # valid and MUST be committed — failing here instead would strand the catalog
      # on an ever-staler file while fixing nothing. The job is failed at the very
      # end, after the push, by "Fail on unreachable packages".
      - name: Run sync
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/sync.sh
          rc=$?
          set -e
          if [[ $rc -eq 2 ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif [[ $rc -ne 0 ]]; then
            exit $rc
          fi

      # Validate BEFORE committing — a format / completeness / monotonic violation,
      # or an icon that regressed against the committed baseline, fails the job so a
      # broken file is never pushed. Both published files are gated, each against
      # its own baseline.
      - name: Validate published files
        run: |
          git show HEAD:packages.json > /tmp/packages.baseline.json 2>/dev/null || true
          git show HEAD:packages-all.json > /tmp/all.baseline.json 2>/dev/null || true
          node scripts/lib/validate.js packages.json /tmp/packages.baseline.json
          node scripts/lib/validate.js packages-all.json /tmp/all.baseline.json

      # The gate's whole legacy guarantee is that packages.json never carries an
      # experiment entry — old neo-web builds render that file unconditionally, so
      # one leak there defeats it. Also assert packages.json is a strict subset of
      # packages-all.json, which catches the two files drifting apart.
      - name: Assert legacy view integrity
        run: |
          leaked=$(jq -c '[.[] | select(.experiment == true) | .name]' packages.json)
          if [[ "$leaked" != "[]" ]]; then
            echo "ERROR experiment packages leaked into packages.json: $leaked"
            exit 1
          fi
          missing=$(jq -c --slurpfile all packages-all.json \
            '[.[] | select(.name as $n | ($all[0] | map(.name) | index($n)) == null) | .name]' packages.json)
          if [[ "$missing" != "[]" ]]; then
            echo "ERROR packages.json entries absent from packages-all.json: $missing"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.json packages-all.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync packages [skip ci]"
            git push
          fi

      # The hub deliberately never deletes an entry, so nothing else signals that a
      # registered repository has gone dark. This red build IS that signal, and it
      # keeps firing every night until someone restores access or edits packages.yaml.
      # Runs last so the publish above still lands.
      - name: Fail on unreachable packages
        if: steps.sync.outputs.skipped == 'true'
        run: |
          echo "ERROR one or more registered repositories could not be read — see 'Run sync'."
          echo "Restore public access, or remove the package from packages.yaml."
          exit 1
